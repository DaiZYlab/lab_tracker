<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="104" fill="#ba0c2f"/>
    <text x="256" y="322" font-family="Georgia, serif" font-size="210" font-weight="bold" fill="#ffffff" text-anchor="middle">DL</text>
  </svg>
</template>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://use.typekit.net/mav2zlt.css">
<link rel="stylesheet" href="_ds/washu-medicine-design-system-67f651de-5569-428a-b3c3-42f44ab2d2c2/colors_and_type.css">
<script src="firebase-config.js"></script>
<script src="firebase-sync.js"></script>
<style>
  html,body { margin:0; background:#e9e6e1; font-family:var(--font-sans); }
  * { box-sizing:border-box; }
  .scr { position:absolute; inset:0; display:flex; flex-direction:column; }
  .body { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; background:#f5f2ee; padding:12px 14px 96px; }
  .mcard { background:#fff; border:1px solid #ececec; border-radius:16px; padding:14px 15px; margin-bottom:11px; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:100px; }
  .in { font-family:inherit; border:none; background:transparent; outline:none; border-radius:6px; width:100%; }
  .in:focus { background:#f5f2ee; }
  .sel { font-family:inherit; border:1px solid #e6e6e6; background:#fff; outline:none; border-radius:8px; padding:6px 8px; font-size:12.5px; }
  .addbtn { width:100%; border:1px dashed #e0b8c1; background:#fff; color:#ba0c2f; font-family:inherit; font-weight:700; font-size:13px; padding:11px; border-radius:12px; cursor:pointer; }
  ::-webkit-scrollbar{width:0}
</style>
</helmet>

<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" width="402" height="874" hint-size="402px,874px">
  <div class="scr">
    <!-- header -->
    <div style="padding:58px 16px 12px; background:#ba0c2f; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;">
      <div style="line-height:1.2;">
        <div style="font-size:12px; font-weight:700; color:rgba(255,255,255,.75); letter-spacing:.04em; text-transform:uppercase;">Dai Lab · WashU Medicine</div>
        <div style="font-size:22px; font-weight:700; color:#fff; margin-top:2px;">{{ activeTitle }}</div>
      </div>
      <span onClick="{{ onAdd }}" style="width:38px; height:38px; border-radius:100px; background:rgba(255,255,255,.18); color:#fff; font-size:24px; font-weight:400; display:flex; align-items:center; justify-content:center; cursor:pointer;">+</span>
    </div>

    <!-- scrolling body -->
    <div class="body">

      <!-- PEOPLE -->
      <sc-if value="{{ isPeople }}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{ peopleCards }}" as="p" hint-placeholder-count="6">
          <div class="mcard">
            <div style="display:flex; align-items:center; gap:12px;">
              {{ p.avatar }}
              <div style="flex:1; min-width:0;">
                <input class="in" value="{{ p.name }}" onInput="{{ p.setName }}" style="font-size:16px; font-weight:700;">
                <select class="in" value="{{ p.role }}" onChange="{{ p.setRole }}" style="font-size:12px; color:#9a9a9a; margin-top:1px;">
                  <sc-for list="{{ roleOptions }}" as="ro" hint-placeholder-count="8"><option value="{{ ro }}">{{ ro }}</option></sc-for>
                </select>
              </div>
              <span style="width:10px; height:10px; border-radius:100px; background:{{ p.dot }};"></span>
              <span onClick="{{ p.onRemovePerson }}" style="color:#c8c8c8; font-size:20px; cursor:pointer; padding-left:4px;">×</span>
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;">
              <sc-for list="{{ p.projects }}" as="pr" hint-placeholder-count="2">
                <span class="chip" style="color:{{ pr.fg }}; background:{{ pr.bg }};">
                  <span onClick="{{ pr.onToggleLead }}" style="width:8px;height:8px;border-radius:100px;background:{{ pr.dotBg }};border:1px solid {{ pr.dotBorder }};"></span>
                  {{ pr.label }}
                  <span onClick="{{ pr.onRemove }}" style="opacity:.5;">×</span>
                </span>
              </sc-for>
              <select class="sel" value="" onChange="{{ p.onAddProjectSelect }}" style="font-size:11px; font-weight:700; color:#ba0c2f; border:1px dashed #e0b8c1; padding:3px 8px; border-radius:100px;">
                <sc-for list="{{ p.addProjectOptions }}" as="ap" hint-placeholder-count="3"><option value="{{ ap.v }}">{{ ap.label }}</option></sc-for>
              </select>
            </div>
            <div style="margin-top:12px; display:flex; flex-direction:column; gap:4px;">
              <sc-for list="{{ p.work }}" as="w" hint-placeholder-count="3">
                <div style="display:flex; align-items:center; gap:9px;">
                  <span onClick="{{ w.onToggle }}" style="width:20px;height:20px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:{{ w.boxBg }};border:1.5px solid {{ w.boxBorder }};color:{{ w.markColor }};">✓</span>
                  <input class="in" value="{{ w.text }}" onInput="{{ w.setText }}" style="flex:1; font-size:13.5px; color:{{ w.textColor }}; text-decoration:{{ w.deco }};">
                  <span onClick="{{ w.onRemove }}" style="opacity:.5; font-size:16px; cursor:pointer;">×</span>
                </div>
              </sc-for>
              <span onClick="{{ p.onAddWork }}" style="color:#ba0c2f; font-weight:700; font-size:12.5px; padding:6px 2px; cursor:pointer;">+ add task</span>
            </div>
          </div>
        </sc-for>
      </sc-if>

      <!-- PROJECTS -->
      <sc-if value="{{ isLabProjects }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ labCards }}" as="c" hint-placeholder-count="5">
          <div class="mcard" style="border-left:4px solid {{ c.fg }};">
            <div style="display:flex; align-items:flex-start; gap:8px;">
              <input class="in" value="{{ c.name }}" onInput="{{ c.setName }}" style="font-size:15px; font-weight:700; flex:1;">
              <span onClick="{{ c.onRemove }}" style="color:#c8c8c8; font-size:19px; cursor:pointer;">×</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
              <select class="sel" value="{{ c.status }}" onChange="{{ c.setStatus }}" style="flex:1;">
                <sc-for list="{{ statusOptions }}" as="so" hint-placeholder-count="3"><option value="{{ so.v }}">{{ so.label }}</option></sc-for>
              </select>
              <input class="sel" value="{{ c.pct }}" onInput="{{ c.setPct }}" type="number" min="0" max="100" style="width:60px; text-align:right; font-weight:700;">
            </div>
            <div style="height:7px; background:#efefef; border-radius:100px; overflow:hidden; margin-top:10px;">
              <div style="height:100%; border-radius:100px; width:{{ c.pct }}%; background:{{ c.fg }};"></div>
            </div>
            <input class="in" value="{{ c.next }}" onInput="{{ c.setNext }}" placeholder="Next step…" style="font-size:12.5px; color:#666; margin-top:10px; padding:3px 4px; border:1px solid #eee;">
            <div style="margin-top:11px; padding-top:10px; border-top:1px solid #f2f2f2; display:flex; flex-direction:column; gap:4px;">
              <sc-for list="{{ c.tasks }}" as="tk" hint-placeholder-count="2">
                <div style="display:flex; align-items:center; gap:9px;">
                  <span onClick="{{ tk.onToggle }}" style="width:18px;height:18px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:{{ tk.boxBg }};border:1.5px solid {{ tk.boxBorder }};color:{{ tk.markColor }};">✓</span>
                  <input class="in" value="{{ tk.text }}" onInput="{{ tk.setText }}" style="flex:1; font-size:13px; color:{{ tk.textColor }}; text-decoration:{{ tk.deco }};">
                  <span onClick="{{ tk.onRemove }}" style="opacity:.5; font-size:15px; cursor:pointer;">×</span>
                </div>
              </sc-for>
              <span onClick="{{ c.onAddTask }}" style="color:#ba0c2f; font-weight:700; font-size:12px; padding:5px 2px; cursor:pointer;">+ add task</span>
            </div>
            <div style="display:flex; align-items:center; margin-top:11px;">
              <sc-for list="{{ c.people }}" as="pp" hint-placeholder-count="2">{{ pp.avatar }}</sc-for>
              <sc-if value="{{ c.noTeam }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px; color:#bbb;">no one assigned</span></sc-if>
            </div>
          </div>
        </sc-for>
      </sc-if>

      <!-- COLLABORATIONS -->
      <sc-if value="{{ isProjects }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ collabCards }}" as="c" hint-placeholder-count="5">
          <div class="mcard" style="border-left:4px solid {{ c.fg }};">
            <div style="display:flex; align-items:flex-start; gap:8px;">
              <input class="in" value="{{ c.name }}" onInput="{{ c.setName }}" style="font-size:15px; font-weight:700; flex:1;">
              <span onClick="{{ c.onRemove }}" style="color:#c8c8c8; font-size:19px; cursor:pointer;">×</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
              <select class="sel" value="{{ c.status }}" onChange="{{ c.setStatus }}" style="flex:1;">
                <sc-for list="{{ statusOptions }}" as="so" hint-placeholder-count="3"><option value="{{ so.v }}">{{ so.label }}</option></sc-for>
              </select>
              <select class="sel" value="{{ c.scope }}" onChange="{{ c.setScope }}" style="flex:1;">
                <sc-for list="{{ scopeOptions }}" as="scp" hint-placeholder-count="2"><option value="{{ scp.v }}">{{ scp.label }}</option></sc-for>
              </select>
            </div>
            <input class="in" value="{{ c.partner }}" onInput="{{ c.setPartner }}" placeholder="collaborating lab…" style="font-size:12.5px; color:#007d8a; font-weight:600; margin-top:9px; padding:3px 4px; border:1px solid #eee;">
            <input class="in" value="{{ c.next }}" onInput="{{ c.setNext }}" placeholder="Next step…" style="font-size:12.5px; color:#666; margin-top:8px; padding:3px 4px; border:1px solid #eee;">
            <div style="margin-top:11px; padding-top:10px; border-top:1px solid #f2f2f2; display:flex; flex-direction:column; gap:4px;">
              <sc-for list="{{ c.tasks }}" as="tk" hint-placeholder-count="2">
                <div style="display:flex; align-items:center; gap:9px;">
                  <span onClick="{{ tk.onToggle }}" style="width:18px;height:18px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:{{ tk.boxBg }};border:1.5px solid {{ tk.boxBorder }};color:{{ tk.markColor }};">✓</span>
                  <input class="in" value="{{ tk.text }}" onInput="{{ tk.setText }}" style="flex:1; font-size:13px; color:{{ tk.textColor }}; text-decoration:{{ tk.deco }};">
                  <span onClick="{{ tk.onRemove }}" style="opacity:.5; font-size:15px; cursor:pointer;">×</span>
                </div>
              </sc-for>
              <span onClick="{{ c.onAddTask }}" style="color:#ba0c2f; font-weight:700; font-size:12px; padding:5px 2px; cursor:pointer;">+ add task</span>
            </div>
            <div style="display:flex; align-items:center; margin-top:11px;">
              <sc-for list="{{ c.people }}" as="pp" hint-placeholder-count="2">{{ pp.avatar }}</sc-for>
              <sc-if value="{{ c.noTeam }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px; color:#bbb;">no one assigned</span></sc-if>
            </div>
          </div>
        </sc-for>
      </sc-if>

      <!-- GRANTS -->
      <sc-if value="{{ isGrants }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ grantCards }}" as="c" hint-placeholder-count="5">
          <div class="mcard" style="border-left:4px solid {{ c.fg }};">
            <div style="display:flex; align-items:flex-start; gap:8px;">
              <input class="in" value="{{ c.title }}" onInput="{{ c.setTitle }}" style="font-size:15px; font-weight:700; flex:1;">
              <span onClick="{{ c.onRemove }}" style="color:#c8c8c8; font-size:19px; cursor:pointer;">×</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
              <select class="sel" value="{{ c.status }}" onChange="{{ c.setStatus }}" style="flex:1;">
                <sc-for list="{{ statusOptions }}" as="so" hint-placeholder-count="3"><option value="{{ so.v }}">{{ so.label }}</option></sc-for>
              </select>
              <select class="sel" value="{{ c.stage }}" onChange="{{ c.setStage }}" style="flex:1;">
                <sc-for list="{{ grantStages }}" as="gs" hint-placeholder-count="4"><option value="{{ gs }}">{{ gs }}</option></sc-for>
              </select>
            </div>
            <div style="display:flex; gap:8px; margin-top:9px;">
              <input class="in" value="{{ c.mechanism }}" onInput="{{ c.setMechanism }}" placeholder="Mechanism" style="flex:1; font-size:12px; color:#666; padding:3px 4px; border:1px solid #eee;">
              <input class="in" value="{{ c.agency }}" onInput="{{ c.setAgency }}" placeholder="Agency" style="width:88px; font-size:12px; color:#666; padding:3px 4px; border:1px solid #eee;">
            </div>
            <input class="in" value="{{ c.lead }}" onInput="{{ c.setLead }}" placeholder="PI / lead" style="font-size:12.5px; font-weight:600; margin-top:8px; padding:3px 4px; border:1px solid #eee;">
            <input class="in" value="{{ c.due }}" onInput="{{ c.setDue }}" placeholder="deadline" style="font-size:12.5px; color:#ba0c2f; font-weight:600; margin-top:8px; padding:3px 4px; border:1px solid #eee;">
            <input class="in" value="{{ c.next }}" onInput="{{ c.setNext }}" placeholder="Next step…" style="font-size:12.5px; color:#666; margin-top:8px; padding:3px 4px; border:1px solid #eee;">
          </div>
        </sc-for>
      </sc-if>

      <!-- PAPERS -->
      <sc-if value="{{ isPapers }}" hint-placeholder-val="{{ false }}">
        <sc-for list="{{ paperCards }}" as="c" hint-placeholder-count="5">
          <div class="mcard" style="border-left:4px solid {{ c.fg }};">
            <div style="display:flex; align-items:flex-start; gap:8px;">
              <input class="in" value="{{ c.title }}" onInput="{{ c.setTitle }}" style="font-size:15px; font-weight:700; flex:1;">
              <span onClick="{{ c.onRemove }}" style="color:#c8c8c8; font-size:19px; cursor:pointer;">×</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
              <select class="sel" value="{{ c.status }}" onChange="{{ c.setStatus }}" style="flex:1;">
                <sc-for list="{{ statusOptions }}" as="so" hint-placeholder-count="3"><option value="{{ so.v }}">{{ so.label }}</option></sc-for>
              </select>
              <select class="sel" value="{{ c.stage }}" onChange="{{ c.setStage }}" style="flex:1;">
                <sc-for list="{{ paperStages }}" as="ps" hint-placeholder-count="4"><option value="{{ ps }}">{{ ps }}</option></sc-for>
              </select>
            </div>
            <input class="in" value="{{ c.journal }}" onInput="{{ c.setJournal }}" placeholder="target journal" style="font-size:12.5px; color:#007d8a; font-weight:600; margin-top:9px; padding:3px 4px; border:1px solid #eee;">
            <input class="in" value="{{ c.lead }}" onInput="{{ c.setLead }}" placeholder="first author" style="font-size:12.5px; font-weight:600; margin-top:8px; padding:3px 4px; border:1px solid #eee;">
            <input class="in" value="{{ c.next }}" onInput="{{ c.setNext }}" placeholder="Next step…" style="font-size:12.5px; color:#666; margin-top:8px; padding:3px 4px; border:1px solid #eee;">
          </div>
        </sc-for>
      </sc-if>

    </div>

    <!-- bottom tab bar -->
    <div style="position:absolute; bottom:0; left:0; right:0; height:84px; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-top:1px solid #e6e2dc; display:flex; padding:8px 4px 22px;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
        <div onClick="{{ t.onClick }}" style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; color:{{ t.color }};">
          <div style="width:24px; height:24px;">{{ t.icon }}</div>
          <span style="font-size:10px; font-weight:600;">{{ t.label }}</span>
        </div>
      </sc-for>
    </div>
  </div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.KEY = 'daiLabTracker.v1';
    this.roleColor = { 'Postdoc':'#ba0c2f', 'PhD student':'#007d8a', 'Research Scientist':'#13322b', 'Staff Scientist':'#13322b', 'Bioinformatician':'#215732', 'Biostat RA':'#215732', 'Research Assistant':'#215732', 'Undergraduate':'#9a9a9a' };
    this.roleOptions = ['Postdoc','PhD student','Research Scientist','Staff Scientist','Bioinformatician','Biostat RA','Research Assistant','Undergraduate'];
    this.scopeOptions = [{v:'WashU',label:'WashU'},{v:'External',label:'External'}];
    this.grantStages = ['Planning','Drafting','Submitted','Under review'];
    this.paperStages = ['Drafting','Submitted','In revision'];
    this.statusOptions = [{v:'on',label:'On track'},{v:'risk',label:'At risk'},{v:'stall',label:'Stalled'}];
    this.S = { on:{fg:'#215732'}, risk:{fg:'#f1b434'}, stall:{fg:'#ff6d6a'} };
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(this.KEY)); } catch(e) {}
    if (saved && saved.people) {
      this.state = { view:'people', people:saved.people, projects:saved.projects||[], grants:saved.grants||[], papers:saved.papers||[], labProjects:saved.labProjects||[] };
    } else {
      this.state = { view:'people', people:[], projects:[], grants:[], papers:[], labProjects:[] };
    }
  }
  componentDidMount(){ this._syncTries=0; this._waitForSync(); }
  _waitForSync(){
    if (window.LabSync) {
      window.LabSync.subscribe((d)=>{ this._fromRemote=true; this.setState({ people:d.people||[], projects:d.projects||[], grants:d.grants||[], papers:d.papers||[], labProjects:d.labProjects||[] }); });
      window.LabSync.init().then((ok)=>{
        if (ok) window.LabSync.save({ people:this.state.people, projects:this.state.projects, grants:this.state.grants, papers:this.state.papers, labProjects:this.state.labProjects });
      });
      return;
    }
    if (this._syncTries++ < 40) setTimeout(()=>this._waitForSync(), 150);
  }
  _persist(){ try { localStorage.setItem(this.KEY, JSON.stringify({ people:this.state.people, projects:this.state.projects, grants:this.state.grants, papers:this.state.papers, labProjects:this.state.labProjects })); } catch(e) {} }
  componentDidUpdate(){
    this._persist();
    if (this._fromRemote) { this._fromRemote=false; return; }
    if (window.LabSync && window.LabSync.enabled) window.LabSync.save({ people:this.state.people, projects:this.state.projects, grants:this.state.grants, papers:this.state.papers, labProjects:this.state.labProjects });
  }
  setView(v){ this.setState({ view:v }); }
  initials(name){ const a=(name||'').trim().split(/\s+/); return (((a[0]||'')[0]||'')+((a[1]||'')[0]||'')).toUpperCase() || '?'; }
  avatarEl(o){
    const kids = [o.initials];
    if (o.photo) kids.push(React.createElement('img',{key:'i',src:o.photo,alt:'',onError:(e)=>{if(e&&e.target)e.target.style.display='none';},style:{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',objectPosition:'center top'}}));
    return React.createElement('span',{onClick:o.onClick,title:o.title,style:{position:'relative',width:o.size+'px',height:o.size+'px',borderRadius:'100px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:o.fs+'px',fontWeight:700,color:'#fff',flexShrink:0,overflow:'hidden',background:o.color,border:o.border||'none',boxShadow:o.ring||'none',marginRight:o.mr||'0'}},kids);
  }
  teamFor(tag){
    return this.state.people.filter(p => (p.projects||[]).some(pr => pr.name===tag)).map(p => {
      const lead = p.projects.some(pr => pr.name===tag && pr.lead);
      return { avatar: this.avatarEl({ size:24, fs:10, color:this.roleColor[p.role]||'#9a9a9a', initials:this.initials(p.name), photo:p.photo, title:p.name+(lead?' · lead':''), border:'2px solid #fff', mr:'-6px', ring: lead?'0 0 0 2px #f1b434':'none' }) };
    });
  }
  // people
  _mut(pi,fn){ this.setState(s => ({ people: s.people.map((p,i)=> i!==pi?p:fn(p)) })); }
  toggle(pi,wi){ this._mut(pi, p => ({ ...p, recentWork: p.recentWork.map((w,j)=> j!==wi?w:({...w,done:!w.done})) })); }
  setName(pi,v){ this._mut(pi, p => ({...p,name:v})); }
  setRole(pi,v){ this._mut(pi, p => ({...p,role:v})); }
  removePerson(pi){ this.setState(s => ({ people:s.people.filter((_,i)=>i!==pi) })); }
  addPerson(){ this.setState(s => ({ view:'people', people:[...s.people,{name:'New member',role:'Postdoc',photo:'',projects:[],recentWork:[],blocker:''}] })); }
  addPProjectKey(pi,key){ this._mut(pi, p => ({...p,projects:[...p.projects,{name:key,lead:false}]})); }
  toggleLead(pi,pj){ this._mut(pi, p => ({...p,projects:p.projects.map((x,j)=>j!==pj?x:({...x,lead:!x.lead}))})); }
  removePProject(pi,pj){ this._mut(pi, p => ({...p,projects:p.projects.filter((_,j)=>j!==pj)})); }
  addWork(pi){ this._mut(pi, p => ({...p,recentWork:[...p.recentWork,{text:'New task',done:false,project:''}]})); }
  setWork(pi,wi,v){ this._mut(pi, p => ({...p,recentWork:p.recentWork.map((w,j)=>j!==wi?w:({...w,text:v}))})); }
  removeWork(pi,wi){ this._mut(pi, p => ({...p,recentWork:p.recentWork.filter((_,j)=>j!==wi)})); }
  // lab projects
  _mutLab(i,fn){ this.setState(s => ({ labProjects: s.labProjects.map((p,j)=> j!==i?p:fn(p)) })); }
  setLab(i,f,v){ this._mutLab(i, p => ({...p,[f]:v})); }
  setLabPct(i,v){ let n=parseInt(v,10); if(isNaN(n))n=0; n=Math.max(0,Math.min(100,n)); this.setLab(i,'pct',n); }
  removeLab(i){ this.setState(s => ({ labProjects:s.labProjects.filter((_,j)=>j!==i) })); }
  addLab(){ this.setState(s => ({ view:'labprojects', labProjects:[...s.labProjects,{key:'proj'+(s.labProjects.length+1),name:'New project',status:'on',pct:0,next:'',tasks:[]}] })); }
  addLabTask(i){ this._mutLab(i, p => ({...p,tasks:[...(p.tasks||[]),{text:'New task',done:false}]})); }
  toggleLabTask(i,ti){ this._mutLab(i, p => ({...p,tasks:p.tasks.map((t,j)=>j!==ti?t:({...t,done:!t.done}))})); }
  setLabTask(i,ti,v){ this._mutLab(i, p => ({...p,tasks:p.tasks.map((t,j)=>j!==ti?t:({...t,text:v}))})); }
  removeLabTask(i,ti){ this._mutLab(i, p => ({...p,tasks:p.tasks.filter((_,j)=>j!==ti)})); }
  // collaborations
  _mutProj(i,fn){ this.setState(s => ({ projects: s.projects.map((p,j)=> j!==i?p:fn(p)) })); }
  setProj(i,f,v){ this._mutProj(i, p => ({...p,[f]:v})); }
  removeProj(i){ this.setState(s => ({ projects:s.projects.filter((_,j)=>j!==i) })); }
  addProj(){ this.setState(s => ({ view:'projects', projects:[...s.projects,{key:'tag'+(s.projects.length+1),name:'New collaboration',scope:'WashU',partner:'',status:'on',pct:0,next:'',tasks:[]}] })); }
  addProjTask(i){ this._mutProj(i, p => ({...p,tasks:[...(p.tasks||[]),{text:'New task',done:false}]})); }
  toggleProjTask(i,ti){ this._mutProj(i, p => ({...p,tasks:p.tasks.map((t,j)=>j!==ti?t:({...t,done:!t.done}))})); }
  setProjTask(i,ti,v){ this._mutProj(i, p => ({...p,tasks:p.tasks.map((t,j)=>j!==ti?t:({...t,text:v}))})); }
  removeProjTask(i,ti){ this._mutProj(i, p => ({...p,tasks:p.tasks.filter((_,j)=>j!==ti)})); }
  // grants
  setGrant(i,f,v){ this.setState(s => ({ grants:s.grants.map((g,j)=>j!==i?g:({...g,[f]:v})) })); }
  removeGrant(i){ this.setState(s => ({ grants:s.grants.filter((_,j)=>j!==i) })); }
  addGrant(){ this.setState(s => ({ view:'grants', grants:[...s.grants,{title:'New grant',mechanism:'',agency:'',lead:'',stage:'Planning',status:'on',due:'',next:''}] })); }
  // papers
  setPaper(i,f,v){ this.setState(s => ({ papers:s.papers.map((p,j)=>j!==i?p:({...p,[f]:v})) })); }
  removePaper(i){ this.setState(s => ({ papers:s.papers.filter((_,j)=>j!==i) })); }
  addPaper(){ this.setState(s => ({ view:'papers', papers:[...s.papers,{title:'New paper',journal:'',lead:'',stage:'Drafting',status:'on',next:''}] })); }

  icon(name,color){
    const s = { width:24, height:24, viewBox:'0 0 24 24', fill:'none', stroke:color, strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round' };
    const P = {
      people:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 7a4 4 0 1 0 0 0.01 M23 21v-2a4 4 0 0 0-3-3.87',
      projects:'M9 11l3 3L22 4 M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',
      collab:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M2 12h20 M12 2a15 15 0 0 1 0 20 M12 2a15 15 0 0 0 0 20',
      grants:'M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21 8 14 2 9.4h7.6z',
      papers:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M8 13h8 M8 17h8',
    };
    const paths = P[name].split(' M').map((d,k)=> React.createElement('path',{key:k, d:(k?'M':'')+d}));
    return React.createElement('svg', s, paths);
  }

  renderVals(){
    const S=this.S, view=this.state.view;
    const titles = { people:'People', labprojects:'Projects', projects:'Collaborations', grants:'Grants', papers:'Papers' };
    const tabDefs = [['people','People'],['labprojects','Projects'],['projects','Collab'],['grants','Grants'],['papers','Papers']];
    const iconName = { people:'people', labprojects:'projects', projects:'collab', grants:'grants', papers:'papers' };
    const tabs = tabDefs.map(([key,label]) => {
      const on = view===key;
      return { label, onClick:()=>this.setView(key), color: on?'#ba0c2f':'#9a9a9a', icon: this.icon(iconName[key], on?'#ba0c2f':'#9a9a9a') };
    });
    const adders = { people:()=>this.addPerson(), labprojects:()=>this.addLab(), projects:()=>this.addProj(), grants:()=>this.addGrant(), papers:()=>this.addPaper() };

    const projByKey = {}; this.state.labProjects.forEach(lp => { projByKey[lp.key]=lp.name; });
    const peopleCards = this.state.people.map((p,pi) => ({
      name:p.name, role:p.role, dot:(p.blocker&&p.blocker.trim())?'#ba0c2f':'#215732',
      avatar:this.avatarEl({ size:44, fs:14, color:this.roleColor[p.role]||'#9a9a9a', initials:this.initials(p.name), photo:p.photo }),
      setName:(e)=>this.setName(pi,e.target.value), setRole:(e)=>this.setRole(pi,e.target.value), onRemovePerson:()=>this.removePerson(pi), onAddWork:()=>this.addWork(pi),
      addProjectOptions:[{v:'',label:'+ project'}].concat(this.state.labProjects.filter(lp=>!p.projects.some(x=>x.name===lp.key)).map(lp=>({v:lp.key,label:lp.name}))),
      onAddProjectSelect:(e)=>{ const v=e.target.value; if(v) this.addPProjectKey(pi,v); },
      projects:p.projects.map((pr,pj)=>({
        label:(projByKey[pr.name]||pr.name), bg:pr.lead?'#fbe9ec':'#f2f2f2', fg:pr.lead?'#ba0c2f':'#555',
        dotBg:pr.lead?'#ba0c2f':'transparent', dotBorder:pr.lead?'#ba0c2f':'#c9b2b8',
        onToggleLead:()=>this.toggleLead(pi,pj), onRemove:()=>this.removePProject(pi,pj),
      })),
      work:p.recentWork.map((w,wi)=>({
        text:w.text, onToggle:()=>this.toggle(pi,wi), setText:(e)=>this.setWork(pi,wi,e.target.value), onRemove:()=>this.removeWork(pi,wi),
        boxBg:w.done?'#ba0c2f':'#fff', boxBorder:w.done?'#ba0c2f':'#c9c9c9', markColor:w.done?'#fff':'transparent', textColor:w.done?'#b3b3b3':'#333', deco:w.done?'line-through':'none',
      })),
    }));

    const taskVals = (tasks, toggle, setT, rem) => (tasks||[]).map((tk,ti)=>({
      text:tk.text, onToggle:()=>toggle(ti), setText:(e)=>setT(ti,e.target.value), onRemove:()=>rem(ti),
      boxBg:tk.done?'#ba0c2f':'#fff', boxBorder:tk.done?'#ba0c2f':'#c9c9c9', markColor:tk.done?'#fff':'transparent', textColor:tk.done?'#b3b3b3':'#333', deco:tk.done?'line-through':'none',
    }));

    const labCards = this.state.labProjects.map((p,i)=>{
      const team=this.teamFor(p.key);
      return { name:p.name, status:p.status, pct:p.pct, next:p.next, fg:S[p.status].fg, people:team, noTeam:team.length===0,
        setName:(e)=>this.setLab(i,'name',e.target.value), setNext:(e)=>this.setLab(i,'next',e.target.value), setStatus:(e)=>this.setLab(i,'status',e.target.value), setPct:(e)=>this.setLabPct(i,e.target.value), onRemove:()=>this.removeLab(i), onAddTask:()=>this.addLabTask(i),
        tasks:taskVals(p.tasks,(ti)=>this.toggleLabTask(i,ti),(ti,v)=>this.setLabTask(i,ti,v),(ti)=>this.removeLabTask(i,ti)) };
    });

    const collabCards = this.state.projects.map((p,i)=>{
      const team=this.teamFor(p.key);
      return { name:p.name, scope:p.scope, partner:p.partner||'', status:p.status, next:p.next, fg:S[p.status].fg, people:team, noTeam:team.length===0,
        setName:(e)=>this.setProj(i,'name',e.target.value), setNext:(e)=>this.setProj(i,'next',e.target.value), setStatus:(e)=>this.setProj(i,'status',e.target.value), setScope:(e)=>this.setProj(i,'scope',e.target.value), setPartner:(e)=>this.setProj(i,'partner',e.target.value), onRemove:()=>this.removeProj(i), onAddTask:()=>this.addProjTask(i),
        tasks:taskVals(p.tasks,(ti)=>this.toggleProjTask(i,ti),(ti,v)=>this.setProjTask(i,ti,v),(ti)=>this.removeProjTask(i,ti)) };
    });

    const grantCards = this.state.grants.map((g,i)=>({
      title:g.title, mechanism:g.mechanism, agency:g.agency, lead:g.lead, stage:g.stage, status:g.status, due:g.due, next:g.next, fg:S[g.status].fg,
      setTitle:(e)=>this.setGrant(i,'title',e.target.value), setMechanism:(e)=>this.setGrant(i,'mechanism',e.target.value), setAgency:(e)=>this.setGrant(i,'agency',e.target.value), setLead:(e)=>this.setGrant(i,'lead',e.target.value), setDue:(e)=>this.setGrant(i,'due',e.target.value), setNext:(e)=>this.setGrant(i,'next',e.target.value), setStatus:(e)=>this.setGrant(i,'status',e.target.value), setStage:(e)=>this.setGrant(i,'stage',e.target.value), onRemove:()=>this.removeGrant(i),
    }));

    const paperCards = this.state.papers.map((p,i)=>({
      title:p.title, journal:p.journal, lead:p.lead, stage:p.stage, status:p.status, next:p.next, fg:S[p.status].fg,
      setTitle:(e)=>this.setPaper(i,'title',e.target.value), setJournal:(e)=>this.setPaper(i,'journal',e.target.value), setLead:(e)=>this.setPaper(i,'lead',e.target.value), setNext:(e)=>this.setPaper(i,'next',e.target.value), setStatus:(e)=>this.setPaper(i,'status',e.target.value), setStage:(e)=>this.setPaper(i,'stage',e.target.value), onRemove:()=>this.removePaper(i),
    }));

    return {
      tabs, activeTitle:titles[view]||'', onAdd:adders[view]||(()=>{}),
      isPeople:view==='people', isLabProjects:view==='labprojects', isProjects:view==='projects', isGrants:view==='grants', isPapers:view==='papers',
      roleOptions:this.roleOptions, statusOptions:this.statusOptions, scopeOptions:this.scopeOptions, grantStages:this.grantStages, paperStages:this.paperStages,
      peopleCards, labCards, collabCards, grantCards, paperCards,
    };
  }
}
</script>
</body>
</html>
